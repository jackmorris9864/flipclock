<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Sense Flip Clock And Weather</title>
<style>
html,body{margin:0;height:100%;background:#0f1114;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
nav{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;transition:opacity .4s}
nav.hide{opacity:0;pointer-events:none}
button{font:600 13px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
</style></head><body>
<canvas id="c"></canvas>
<nav id="n"><button id="bl">City</button><button id="bu">°C / °F</button><button id="bt">12 / 24h</button><button id="bf">Effects</button><button id="bs">Fullscreen</button></nav>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
const cfg=Object.assign({city:'London',f:false,h24:false,fx:true},(()=>{try{return JSON.parse(localStorage.getItem('flip'))||{}}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem('flip',JSON.stringify(cfg))}catch(e){}};
let W=0,H=0;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

const BG='#0f1114',CT='#30343a',CB='#282b30',INK='#f4f4f4',DIM='#cfd7e0',SUN='#ffb52e',CLOUD='#dfe3e8',STORM='#aab2bb',RAIN='#5fb4ff';
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hx=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hx(x.map((v,i)=>v+(y[i]-v)*t))};
const shade=(c,k)=>hx(rgb(c).map(v=>v*k));
const disc=(x,y,r,c)=>{g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=c;g.fill()};
function poly(p,f){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fillStyle=f;g.fill()}
function txt(s,x,y,px,o={}){g.font=(o.b?'600 ':'')+px+'px system-ui,"Segoe UI",sans-serif';g.textAlign=o.al||'left';g.textBaseline=o.bl||'middle';g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=Math.max(2,px/8);g.shadowOffsetY=Math.max(1,px/28);g.fillStyle=o.c||INK;g.fillText(s,x,y);g.shadowColor='transparent'}

/* ---- flip digits: 7-segment polygons, clipped at the hinge so each half can fold ---- */
const T=.17,hs=(cx,cy,l)=>{const a=l/2,t=T/2;return[[cx-a,cy],[cx-a+t,cy-t],[cx+a-t,cy-t],[cx+a,cy],[cx+a-t,cy+t],[cx-a+t,cy+t]]},
vs=(cx,cy,l)=>{const a=l/2,t=T/2;return[[cx,cy-a],[cx+t,cy-a+t],[cx+t,cy+a-t],[cx,cy+a],[cx-t,cy+a-t],[cx-t,cy-a+t]]};
const SEG={a:hs(.5,.12,.69),g:hs(.5,1,.69),d:hs(.5,1.88,.69),f:vs(.11,.56,.79),b:vs(.89,.56,.79),e:vs(.11,1.44,.79),c:vs(.89,1.44,.79)};
const DS={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function clip(p,top){const ins=q=>top?q[1]<=1:q[1]>=1,o=[];p.forEach((q,i)=>{const r=p[(i+p.length-1)%p.length];if(ins(q)!=ins(r)){const t=(1-r[1])/(q[1]-r[1]);o.push([r[0]+t*(q[0]-r[0]),1])}if(ins(q))o.push(q)});return o}
const HALF={};for(const d in DS){HALF[d]={};[true,false].forEach(top=>HALF[d][top]=[...DS[d]].map(s=>clip(SEG[s],top)).filter(p=>p.length>=3))}
const FLIP=.55;
class Flip{constructor(v){this.cur=this.prev=v;this.t0=null}
 set(v,t){if(v!==this.cur){this.prev=this.cur;this.cur=v;this.t0=t}}
 prog(t){if(this.t0==null)return null;const p=(t-this.t0)/FLIP;if(p>=1){this.t0=null;return null}return p}}
function card(x,w,hi,ext,top,r,f){if(ext<1)return;const q=Math.min(r,ext);g.beginPath();g.roundRect(x,top?hi-ext:hi,w,ext,top?[q,q,0,0]:[0,0,q,q]);g.fillStyle=f;g.fill()}
function dig(d,x,w,hi,S,top,f){HALF[d][top].forEach(p=>poly(p.map(([u,v])=>[x+u*w,hi+(v-1)*w*S]),f))}
function flip(f,t,x,y,cw,ch){const hh=ch/2,hi=y+hh,r=cw*.1,dw=cw*.62,dx=x+(cw-dw)/2,p=f.prog(t);
 card(x,cw,hi,hh,true,r,CT);dig(f.cur,dx,dw,hi,1,true,INK);card(x,cw,hi,hh,false,r,CB);dig(p==null?f.cur:f.prev,dx,dw,hi,1,false,INK);
 if(p!=null){const top=p<.5,s=top?Math.cos(p*Math.PI):-Math.cos(p*Math.PI),k=.6+.4*s;
  card(x,cw,hi,hh*s,top,r,shade(top?CT:CB,k));dig(top?f.prev:f.cur,dx,dw,hi,s,top,shade(INK,k))}
 const gp=Math.max(2,ch*.012),n=ch*.035;g.fillStyle=BG;g.fillRect(x,hi-gp/2,cw,gp);
 g.beginPath();g.arc(x,hi,n,-Math.PI/2,Math.PI/2);g.fill();g.beginPath();g.arc(x+cw,hi,n,Math.PI/2,Math.PI*1.5);g.fill()}

/* ---- weather ---- */
function desc(c){if(c==0)return['Clear','clear'];if(c==1)return['Mostly clear','partly'];if(c==2)return['Partly cloudy','partly'];if(c==3)return['Overcast','cloud'];
 if([45,48].includes(c))return['Fog','fog'];if([51,53,55,56,57].includes(c))return['Drizzle','rain'];if([61,63,65,66,67,80,81,82].includes(c))return['Rain','rain'];
 if([71,73,75,77,85,86].includes(c))return['Snow','snow'];if([95,96,99].includes(c))return['Thunderstorm','storm'];return['Cloudy','cloud']}
const inten=c=>[51,53,56,61,66,71,80,85].includes(c)?1:[55,57,65,67,75,82,86,95,96,99].includes(c)?3:2;
let wx=null,err='Loading weather...',gen=0,nextF=0;
async function fetchNow(){const my=gen,city=cfg.city;nextF=Date.now()+9e5;
 try{const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error('http');return r.json()});
  const q=await j('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(city));
  if(!q.results)throw Object.assign(new Error("Couldn't find '"+city+"'"),{nf:1});const p=q.results[0];
  const w=await j('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1');
  if(my!==gen)return;wx={name:p.name,temp:w.current.temperature_2m,code:w.current.weather_code,day:!!w.current.is_day,hi:w.daily.temperature_2m_max[0],lo:w.daily.temperature_2m_min[0]};err=''}
 catch(e){if(my!==gen)return;err=e.nf?e.message:'Weather unavailable (offline?)';if(e.nf)wx=null;nextF=Date.now()+6e4}}

/* ---- icons ---- */
function cloud(cx,cy,t,c){g.fillStyle=c;g.beginPath();g.ellipse(cx-.65*t,cy+.2*t,.35*t,.35*t,0,0,7);g.fill();g.beginPath();g.ellipse(cx-.15*t,cy-.1*t,.45*t,.45*t,0,0,7);g.fill();
 g.beginPath();g.ellipse(cx+.45*t,cy+.175*t,.55*t,.375*t,0,0,7);g.fill();g.fillRect(cx-.65*t,cy+.1*t,1.3*t,.45*t)}
function icon(kind,day,cx,cy,s){const ln=(a,b,c,d,col,w)=>{g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
 const sun=(x,y,k)=>{disc(x,y,.45*s*k,SUN);for(let i=0;i<8;i++){const a=i*Math.PI/4;ln(x+Math.cos(a)*.62*s*k,y+Math.sin(a)*.62*s*k,x+Math.cos(a)*.88*s*k,y+Math.sin(a)*.88*s*k,SUN,Math.max(2,.09*s*k))}};
 const moon=(x,y,k)=>{disc(x,y,k*s,'#e9ecf1');[[-.25,-.2,.18],[.2,.1,.22],[-.1,.3,.12]].forEach(([a,b,r])=>disc(x+a*k*s,y+b*k*s,r*k*s,'#cdd3dd'))};
 if(kind=='clear'){day?sun(cx,cy,1):moon(cx,cy,.55)}
 else if(kind=='partly'){day?sun(cx-.35*s,cy-.35*s,.7):moon(cx-.45*s,cy-.45*s,.35);cloud(cx+.1*s,cy+.15*s,.8*s,CLOUD)}
 else if(kind=='cloud')cloud(cx,cy,s,CLOUD);
 else{cloud(cx,cy-.25*s,.9*s,kind=='storm'?STORM:CLOUD);
  for(let i=0;i<3;i++){const x=cx-.45*s+.45*s*i;
   if(kind=='fog')ln(cx-.7*s,cy+(.5+.22*i)*s,cx+.7*s,cy+(.5+.22*i)*s,DIM,Math.max(2,.08*s));
   if(kind=='rain')ln(x,cy+.45*s,x-.12*s,cy+.85*s,RAIN,Math.max(2,.09*s));
   if(kind=='snow'){disc(x,cy+.57*s,.07*s,'#fff');disc(x-.1*s,cy+.85*s,.07*s,'#fff')}}
  if(kind=='storm')poly([[.05,.3],[-.2,.7],[0,.7],[-.1,1.05],[.25,.6],[.05,.6],[.2,.3]].map(p=>[cx+p[0]*s,cy+p[1]*s]),SUN)}}

/* ---- animated sky ---- */
const SKY={'clear:1':['#1c5fc4','#64b0e8'],'clear:0':['#070b1c','#1a2850'],'partly:1':['#2f6fc0','#7fb0d8'],'partly:0':['#0b1128','#243257'],
'cloud:1':['#4f5a69','#7b8794'],'cloud:0':['#10141b','#252c37'],'fog:1':['#6f7a86','#9ba5af'],'fog:0':['#161a20','#2c333c'],
'rain:1':['#3b4755','#66717f'],'rain:0':['#0d1219','#1e2631'],'snow:1':['#66758a','#9aa8b9'],'snow:0':['#161d2a','#303b4d'],'storm:1':['#262d39','#4a5463'],'storm:0':['#07090e','#171c25']};
const CC={partly:'#eef3f8',cloud:'#b4bdc8',rain:'#78838f',snow:'#c9d1db',storm:'#3f4753'};
const sc={sig:'',kind:'none',day:true,rain:[],snow:[],clouds:[],haze:[],stars:[],flash:0,next:0};
function setScene(kind,day,lvl,t){const sig=kind+day+lvl;if(sig==sc.sig)return;let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
 Object.assign(sc,{sig,kind,day,rain:[],snow:[],clouds:[],haze:[],stars:[],flash:0,next:t+4+r()*5});
 if(kind=='rain'||kind=='storm')sc.rain=Array.from({length:[0,50,110,170][lvl]||110},()=>[r(),r(),.6+.4*r()]);
 if(kind=='snow')sc.snow=Array.from({length:lvl==3?140:90},()=>[r(),r(),r(),r()*6.28]);
 const n={partly:3,cloud:6,rain:6,snow:6,storm:6}[kind]||0;sc.clouds=Array.from({length:n},()=>[r()*1.4-.2,.04+.46*r(),.8+.8*r(),.006+.012*r()]);
 if(kind=='fog')sc.haze=Array.from({length:5},(_,i)=>[r(),.1+.17*i,1.2+.8*r(),.004+.006*r()]);
 if(!day&&(kind=='clear'||kind=='partly'))sc.stars=Array.from({length:70},()=>[r(),r()*.7,r()*6.28,r()<.67?1:2])}
function upd(dt,t){sc.rain.forEach(r=>{r[1]+=dt*(.9+.7*r[2]);r[0]=((r[0]-dt*.06)%1+1)%1;if(r[1]>1.05)r[1]-=1.1});
 sc.snow.forEach(s=>{s[1]+=dt*(.05+.07*s[2]);s[3]+=dt*1.2;if(s[1]>1.03)s[1]-=1.06});
 sc.clouds.concat(sc.haze).forEach(c=>{c[0]+=dt*c[3];if(c[0]>1.3)c[0]=-.3});
 if(sc.kind=='storm'&&t>=sc.next){sc.flash=t+.12;sc.next=t+7+Math.random()*8}}
function scene(t){let[top,bot]=SKY[sc.kind+':'+(sc.day?1:0)]||['#14171c','#0b0d10'];if(t<sc.flash){top=shade(top,1.7);bot=shade(bot,1.5)}
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
 if(!cfg.fx)return;const k=Math.max(.7,H/700),night=!sc.day;
 sc.stars.forEach(([x,y,ph,sz])=>{g.fillStyle=mix(mix(top,bot,y),'#ffffff',.35+.65*(.5+.5*Math.sin(t*1.5+ph)));g.fillRect(W*x,H*y,sz*k,sz*k)});
 if(sc.kind=='clear'||sc.kind=='partly'){const px=W*.8,py=H*.17,R=sc.day?H*.32*(1+.03*Math.sin(t*.8)):H*.14,rg=g.createRadialGradient(px,py,0,px,py,R);
  if(sc.day){rg.addColorStop(0,'rgba(255,240,170,1)');rg.addColorStop(.2,'rgba(255,233,160,.75)');rg.addColorStop(1,'rgba(255,233,160,0)')}
  else{rg.addColorStop(0,'rgba(200,212,242,.4)');rg.addColorStop(1,'rgba(200,212,242,0)')}
  g.fillStyle=rg;g.beginPath();g.arc(px,py,R,0,7);g.fill();
  if(sc.day)disc(px,py,H*.052,'#fff7d9');else{const r=H*.05;disc(px,py,r,'#eef1f7');[[-.25,-.2,.18],[.2,.1,.22],[-.1,.3,.12]].forEach(([a,b,c])=>disc(px+a*r,py+b*r,c*r,'#d4d9e3'))}}
 sc.haze.forEach(([x,y,s])=>{g.fillStyle=mix(mix(top,bot,.5),'#e6ebf0',night?.12:.3);g.beginPath();g.ellipse(W*x,H*y,W*.35*s,H*.07*s,0,0,7);g.fill()});
 if(sc.clouds.length){let c=CC[sc.kind];if(night)c=shade(c,sc.kind=='rain'||sc.kind=='storm'?.45:.32);sc.clouds.forEach(([x,y,s])=>cloud(W*x,H*y,H*.16*s,c))}
 if(sc.rain.length){g.strokeStyle=night?'#6d8fc0':'#a9cdf5';g.lineWidth=sc.rain.length>150?2:1;g.beginPath();sc.rain.forEach(([x,y,f])=>{const L=H*.05*f;g.moveTo(W*x,H*y);g.lineTo(W*x-L*.12,H*y+L)});g.stroke()}
 if(sc.snow.length){g.fillStyle='#f4f8ff';g.beginPath();sc.snow.forEach(([x,y,f,ph])=>{const r=H*.005*(.6+f),px=W*(x+.012*Math.sin(ph));g.moveTo(px+r,H*y);g.arc(px,H*y,r,0,7)});g.fill()}}

/* ---- layout + frame ---- */
const fl=[0,1,2,3].map(()=>new Flip('0')),digits=d=>String(cfg.h24?d.getHours():d.getHours()%12||12).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
function draw(t,d){let kind='none',day=true,lvl=0,label='';
 if(wx){const x=desc(wx.code);kind=x[1];label=x[0];day=wx.day;lvl=inten(wx.code)}
 setScene(kind,day,lvl,t);scene(t);
 let cw,ch,pos,bottom;
 if(W>=H*.8){cw=Math.min(W*.9/4.47,H*.48/1.4);ch=cw*1.4;const gp=cw*.06,pr=cw*.36,x0=(W-(4*cw+2*gp+pr))/2,y0=H*.1;
  pos=[[x0,y0],[x0+cw+gp,y0],[x0+2*cw+gp+pr,y0],[x0+3*cw+2*gp+pr,y0]];bottom=y0+ch}
 else{cw=Math.min(W*.9/2.06,H*.24/1.4);ch=cw*1.4;const gp=cw*.06,x0=(W-2*cw-gp)/2,y0=H*.07,y1=y0+ch*1.12;
  pos=[[x0,y0],[x0+cw+gp,y0],[x0,y1],[x0+cw+gp,y1]];bottom=y1+ch}
 fl.forEach((f,i)=>flip(f,t,pos[i][0],pos[i][1],cw,ch));
 if(!cfg.h24)txt(d.getHours()>=12?'PM':'AM',pos[0][0]+cw*.04,pos[0][1]-ch*.05,ch*.09,{b:1,c:DIM,bl:'bottom'});
 const u=Math.min(ch,W*.42),yd=bottom+u*.17,yw=yd+u*.42;
 txt(d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),W/2,yd,u*.13,{al:'center'});
 if(wx){const c2=v=>Math.round(cfg.f?v*9/5+32:v),T=c2(wx.temp)+'°',
  lines=[[wx.name,u*.11,1,INK,-.12],[label,u*.085,0,DIM,.02],['H '+c2(wx.hi)+'°   L '+c2(wx.lo)+'° '+(cfg.f?'F':'C'),u*.085,0,DIM,.15]];
  let iwid=0;lines.forEach(l=>{g.font=(l[2]?'600 ':'')+l[1]+'px system-ui';iwid=Math.max(iwid,g.measureText(l[0]).width)});
  g.font=u*.3+'px system-ui';const tw=g.measureText(T).width,iw=u*.36,gp=u*.12,x=(W-(iw+tw+gp+iwid))/2;
  icon(kind,wx.day,x+iw/2-u*.02,yw,u*.15);txt(T,x+iw,yw,u*.3);lines.forEach(l=>txt(l[0],x+iw+tw+gp,yw+u*l[4],l[1],{b:l[2],c:l[3]}))}
 if(err)txt(err,W/2,yw+(wx?u*.25:0),u*.085,{al:'center',c:DIM})}
let last=performance.now()/1000,init=false;
function frame(){requestAnimationFrame(frame);const t=performance.now()/1000,dt=Math.min(.1,t-last);last=t;const d=new Date(),s=digits(d);
 if(!init){fl.forEach((f,i)=>f.cur=f.prev=s[i]);init=true}else fl.forEach((f,i)=>f.set(s[i],t));
 if(Date.now()>=nextF)fetchNow();if(cfg.fx)upd(dt,t);draw(t,d)}

/* ---- controls ---- */
const nav=$('n');let idle;const wake=()=>{nav.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>nav.classList.add('hide'),5000)};
['pointerdown','pointermove','keydown'].forEach(e=>addEventListener(e,wake));wake();
$('bl').onclick=()=>{const c=prompt('City name:',cfg.city);if(c&&c.trim()){cfg.city=c.trim();save();gen++;wx=null;err='Loading weather...';nextF=0}};
$('bu').onclick=()=>{cfg.f=!cfg.f;save()};$('bt').onclick=()=>{cfg.h24=!cfg.h24;save()};$('bf').onclick=()=>{cfg.fx=!cfg.fx;save()};
$('bs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{const b={l:'bl',u:'bu',t:'bt',e:'bf',f:'bs'}[e.key.toLowerCase()];if(b)$(b).click()});
let wl;const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock()});addEventListener('pointerdown',lock,{once:true});lock();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
requestAnimationFrame(frame);
</script></body></html>
